name: Monad Multi-Tentacle Lifecycle

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  run-monad:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn Monad
        uses: actions/checkout@v7

      - name: Thiết lập Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # VẬN HÀNH BẦY NƠ-RON ĐA XÚC TU VÀ 1+N SIÊU XOR
      - name: Kích hoạt Hạt Nhân Monad (Đa Giác Quan)
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_PARENT: ${{ github.event.repository.parent.owner.login }}
        run: python engine.py

      # LƯU VẾT TÍCH BẰNG CHIẾN THUẬT FAST-FORWARD CHỐNG XUNG ĐỘT
      - name: Lưu vết tích tiến hóa phân tán
        run: |
          git config --global user.name "Monad-Swarm-Bot"
          git config --global user.email "bot@monad.node"
          
          git fetch origin main
          git reset origin/main
          git add synapses/ synapse_backward.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "🧬 [Monad Đa Xúc Tu] Hợp nhất giác quan & Siêu XOR [skip ci]"
            git push origin main
          else
            echo "Không có biến đổi mới."
          fi

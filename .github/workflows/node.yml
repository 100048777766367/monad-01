name: Monad Lineage Invariant Lifecycle

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

jobs:
  run-monad-lineage:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn bằng Linux Shell gốc (Thoát ly Node.js)
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # VẬN HÀNH ĐƠN TỬ PHẢ HỆ VƯỢT TỔ (M0 / M1 / M2)
      - name: Vận hành Hạt Nhân Monad Phả Hệ
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_PARENT: ${{ github.event.repository.parent.owner.login }}
        run: python engine.py

      # LƯU VẾT TÍCH BẰNG FAST-FORWARD (CÓ TOKEN BẢO MẬT CHỐNG LỖI 128)
      - name: Lưu vết tích tiến hóa đơn tử
        run: |
          git config --global user.name "Monad-Lineage-Bot"
          git config --global user.email "monad@lineage.node"
          
          # CẤP TOKEN ĐỂ ĐƯỢC PHÉP PUSH (MIỄN NHIỄM LỖI 128)
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git fetch origin main
          git reset origin/main
          git add synapses/ synapse_backward.json synapse_forward.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "💎 [Monad Phả Hệ] Tiến hóa đơn tử thế hệ #(1+N) [skip ci]"
            git push origin main
          else
            echo "Môi trường tĩnh, không có biến đổi mới."
          fi
